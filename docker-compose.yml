services:
  database:
    image: postgres:16-alpine
    container_name: challenge-db
    environment:
      POSTGRES_USER: challenge_user
      POSTGRES_PASSWORD: Challenge123!@
      POSTGRES_DB: ChallengeDB
      POSTGRES_INITDB_ARGS: "-c shared_buffers=256MB -c max_connections=200"
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U challenge_user -d ChallengeDB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - challenge-network
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: challenge-rabbitmq
    ports:
      - "15673:15672"
      - "5673:5672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - challenge-network
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Challenge.API/Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: 1
    container_name: challenge-api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: "http://+:5000"
      ConnectionStrings__DefaultConnection: "Host=database;Port=5432;Database=ChallengeDB;Username=challenge_user;Password=Challenge123!@;Include Error Detail=true"
      RabbitMq__HostName: rabbitmq
    ports:
      - "5000:5000"
    depends_on:
      database:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./Challenge.API/logs:/app/logs
    networks:
      - challenge-network
    restart: unless-stopped

volumes:
  postgres-data:
    driver: local

networks:
  challenge-network:
    driver: bridge
